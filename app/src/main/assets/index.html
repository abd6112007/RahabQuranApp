<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحاب القرآن - لتعليم القرآن الكريم والسنة</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: #1b4332;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 22px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #2d6a4f;
            font-size: 18px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="time"], input[type="text"] {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1b4332;
        }
        .quran-section {
            text-align: center;
            background: #eef7f2;
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed #2d6a4f;
        }
    </style>
</head>
<body>

    <header>
        <h1>رحاب القرآن الكريم والسنة</h1>
    </header>

    <!-- قسم المصحف الشريف -->
    <div class="card quran-section">
        <h3>المصحف الشريف</h3>
        <p>المصحف مدمج ويعمل محلياً بدون الحاجة للاتصال بالإنترنت.</p>
        <!-- يمكنك وضع صور صفحات المصحف أو روابط ملفاتك المحلية هنا -->
        <div id="quranViewer" style="margin-top: 10px; padding: 20px; background: white; border-radius: 5px; border: 1px solid #ddd;">
            <p>صفحة المصحف الأساسية (جاهزة للتصفح)</p>
        </div>
    </div>

    <!-- قسم مواقيت الصلاة القابلة للتعديل -->
    <div class="card">
        <h3>مواقيت الصلاة (قابلة للتعديل)</h3>
        <label>الفجر: <input type="time" id="fajrTime" onchange="savePrayerTimes()"></label>
        <label>الظهر: <input type="time" id="dhuhrTime" onchange="savePrayerTimes()"></label>
        <label>العصر: <input type="time" id="asrTime" onchange="savePrayerTimes()"></label>
        <label>المغرب: <input type="time" id="maghribTime" onchange="savePrayerTimes()"></label>
        <label>العشاء: <input type="time" id="ishaTime" onchange="savePrayerTimes()"></label>
    </div>

    <!-- قسم تنبيهات وإدارة حلقات القرآن -->
    <div class="card">
        <h3>إدارة وتنبيهات الحلقات القرآنية</h3>
        <label>حدد وقت موعد الحلقة القادمة:</label>
        <input type="time" id="sessionTimeInput">
        <button onclick="setSessionAlert()">تثبيت موعد الحلقة وضبط التنبيه</button>
    </div>

    <script>
        // تحميل الأوقات المحفوظة مسبقاً في ذاكرة الهاتف عند فتح التطبيق
        window.onload = function() {
            if(localStorage.getItem('fajr')) document.getElementById('fajrTime').value = localStorage.getItem('fajr');
            if(localStorage.getItem('dhuhr')) document.getElementById('dhuhrTime').value = localStorage.getItem('dhuhr');
            if(localStorage.getItem('asr')) document.getElementById('asrTime').value = localStorage.getItem('asr');
            if(localStorage.getItem('maghrib')) document.getElementById('maghribTime').value = localStorage.getItem('maghrib');
            if(localStorage.getItem('isha')) document.getElementById('ishaTime').value = localStorage.getItem('isha');
            
            if(localStorage.getItem('savedSessionTime')) {
                document.getElementById('sessionTimeInput').value = localStorage.getItem('savedSessionTime');
            }
        };

        // دالة حفظ مواقيت الصلاة تلقائياً عند تعديلها
        function savePrayerTimes() {
            localStorage.setItem('fajr', document.getElementById('fajrTime').value);
            localStorage.setItem('dhuhr', document.getElementById('dhuhrTime').value);
            localStorage.setItem('asr', document.getElementById('asrTime').value);
            localStorage.setItem('maghrib', document.getElementById('maghribTime').value);
            localStorage.setItem('isha', document.getElementById('ishaTime').value);
        }

        // دالة إضافة وتثبيت موعد الحلقة
        function setSessionAlert() {
            const timeVal = document.getElementById('sessionTimeInput').value;
            if (!timeVal) {
                alert('الرجاء اختيار وقت الحلقة أولاً!');
                return;
            }
            
            // طلب إذن الإشعارات من المتصفح/النظام
            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
            
            localStorage.setItem('savedSessionTime', timeVal);
            alert('تم حفظ موعد الحلقة (' + timeVal + ') بنجاح وسيعمل التنبيه في وقته!');
        }
    </script>

</body>
</html>
