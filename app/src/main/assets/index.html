<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E5C2E">
<title>رحاب القرآن</title>
<meta name="application-name" content="رحاب القرآن">
<meta name="apple-mobile-web-app-title" content="رحاب القرآن">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
  :root {
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#FAF9F5;
    --primary:#3E7159; --primary-dark:#274A38; --primary-light:#E6EEE8;
    --gold:#B58A4A; --gold-light:#F3E9D7; --gold-deep:#7A5A28;
    --text:#33352C; --muted:#7A7D71; --border:#E6E4DA;
    --radius:16px; --shadow:0 4px 16px rgba(62,113,89,0.08);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;margin:0;padding:0;min-height:100vh;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .sticky-head{position:sticky;top:0;z-index:40;background:var(--bg);}
  .topbar{background:linear-gradient(135deg, #FBF7EE 0%, #F0E3C7 55%, #E1CDA0 100%);color:var(--primary-dark);padding:13px 16px 16px;border-radius:0 0 22px 22px;box-shadow:0 4px 16px rgba(122,90,40,0.16);}
  .topbar h1{font-family:'Amiri',serif;font-size:19px;margin:0;font-weight:700;}
  .brand-mark{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .brand-left{display:flex;align-items:center;gap:8px;}
  .brand-mark img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;}
  .content{padding:16px;flex:1;}
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);}
  .card h2{font-family:'Amiri',serif;font-size:18px;margin:0 0 12px;color:var(--primary-dark);display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;background:var(--primary);border-radius:50%;display:inline-block;}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin:10px 0 4px;}
  input[type=time]{padding:10px;border-radius:8px;border:1px solid var(--border);width:100%;margin-bottom:10px;font-family:'Tajawal',sans-serif;background:var(--surface);color:var(--text);}
  button{background:var(--primary);color:white;border:none;font-weight:bold;cursor:pointer;padding:10px;border-radius:8px;width:100%;font-family:'Tajawal',sans-serif;}
</style>
</head>
<body>

<div class="app" id="app">
    <div class="sticky-head">
        <div class="topbar">
            <div class="brand-mark">
                <div class="brand-left">
                    <img src="icons/icon-192.png" alt="Logo">
                    <div>
                        <h1>رحاب القرآن</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="content" id="content">
        <!-- الأقسام الأصلية الخاصة بالتطبيق يمكن وضعها هنا -->
        <div class="card">
            <h2><span class="dot"></span>📖 تصفح المصحف الشريف</h2>
            <p style="font-size: 13px; color: var(--muted); margin-bottom: 12px;">تصفح القرآن الكريم كاملاً للعمل بدون إنترنت.</p>
            <button onclick="alert('جاري فتح صفحات المصحف')" style="background: var(--gold);">فتح المصحف</button>
        </div>

        <!-- 1. قسم مواقيت الصلاة (المضاف حديثاً) -->
        <div class="card" style="background: var(--surface-2);">
            <h2><span class="dot" style="background: var(--gold);"></span>🕌 مواقيت الصلاة</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <label>الفجر: <input type="time" id="fajrTime" onchange="savePrayerTimes()"></label>
                <label>الظهر: <input type="time" id="dhuhrTime" onchange="savePrayerTimes()"></label>
                <label>العصر: <input type="time" id="asrTime" onchange="savePrayerTimes()"></label>
                <label>المغرب: <input type="time" id="maghribTime" onchange="savePrayerTimes()"></label>
                <label style="grid-column: span 2;">العشاء: <input type="time" id="ishaTime" onchange="savePrayerTimes()"></label>
            </div>
        </div>

        <!-- 2. قسم تنبيهات الحلقات (المضاف حديثاً) -->
        <div class="card" style="background: var(--primary-light); border-color: var(--primary);">
            <h2><span class="dot" style="background: var(--primary-dark);"></span>⏰ تنبيهات الحلقات</h2>
            <label>اختر وقت موعد الحلقة القادمة:</label>
            <input type="time" id="sessionTimeInput">
            <button onclick="setSessionAlert()" style="margin-top: 5px;">حفظ الموعد وتفعيل التنبيه</button>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', function() {
        if(localStorage.getItem('fajr')) document.getElementById('fajrTime').value = localStorage.getItem('fajr');
        if(localStorage.getItem('dhuhr')) document.getElementById('dhuhrTime').value = localStorage.getItem('dhuhr');
        if(localStorage.getItem('asr')) document.getElementById('asrTime').value = localStorage.getItem('asr');
        if(localStorage.getItem('maghrib')) document.getElementById('maghribTime').value = localStorage.getItem('maghrib');
        if(localStorage.getItem('isha')) document.getElementById('ishaTime').value = localStorage.getItem('isha');
        if(localStorage.getItem('savedSessionTime')) {
            document.getElementById('sessionTimeInput').value = localStorage.getItem('savedSessionTime');
        }
    });

    function savePrayerTimes() {
        localStorage.setItem('fajr', document.getElementById('fajrTime').value);
        localStorage.setItem('dhuhr', document.getElementById('dhuhrTime').value);
        localStorage.setItem('asr', document.getElementById('asrTime').value);
        localStorage.setItem('maghrib', document.getElementById('maghribTime').value);
        localStorage.setItem('isha', document.getElementById('ishaTime').value);
    }

    function setSessionAlert() {
        const timeVal = document.getElementById('sessionTimeInput').value;
        if (!timeVal) {
            alert('الرجاء تحديد الوقت أولاً!');
            return;
        }
        if (window.Notification && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
        localStorage.setItem('savedSessionTime', timeVal);
        alert('تم حفظ موعد الحلقة (' + timeVal + ') بنجاح.');
    }
</script>

</body>
</html>
