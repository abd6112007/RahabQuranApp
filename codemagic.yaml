workflows:
  android-workflow:
    name: Rahab Quran - Android Build
    max_build_duration: 60
    instance_type: linux
    environment:
      groups:
        - keystore_credentials   # سننشئه لاحقاً في إعدادات Codemagic إذا أردت توقيعاً رسمياً
      vars:
        PACKAGE_NAME: "com.rahab.quranapp"
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
